<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дашборд ключевых метрик — воронка продаж</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1220;
    --card-bg: #171b2e;
    --card-bg-2: #1e2338;
    --border: #2a3050;
    --text: #e8eaf6;
    --text-dim: #9aa1c4;
    --accent: #6c8cff;
    --success: #4ade80;
    --danger: #f87171;
    --warning: #fbbf24;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 24px;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 24px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
  }
  .toolbar label {
    font-size: 12px;
    color: var(--text-dim);
    display: block;
    margin-bottom: 4px;
  }
  .toolbar input[type="date"] {
    background: var(--card-bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 13px;
  }
  .toolbar button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s;
  }
  .toolbar button:hover { filter: brightness(1.1); }
  .toolbar button.secondary {
    background: var(--card-bg-2);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .quick-ranges { display: flex; gap: 6px; }
  .quick-ranges button {
    background: var(--card-bg-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 500;
  }
  .quick-ranges button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .kpi-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
  }
  .kpi-value {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.1;
  }
  .kpi-label {
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 6px;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  @media (max-width: 900px) {
    .grid-2 { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  .card h2 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 16px;
  }

  .funnel-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .funnel-row:last-child { border-bottom: none; }
  .funnel-name { flex: 0 0 190px; color: var(--text-dim); }
  .funnel-bar-wrap { flex: 1; background: var(--card-bg-2); border-radius: 6px; height: 22px; overflow: hidden; position: relative; }
  .funnel-bar { height: 100%; background: linear-gradient(90deg, var(--accent), #8fa3ff); border-radius: 6px; transition: width 0.4s ease; }
  .funnel-count { flex: 0 0 50px; text-align: right; font-weight: 600; }
  .funnel-conv { flex: 0 0 60px; text-align: right; color: var(--text-dim); font-size: 11px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--text-dim); font-weight: 500; padding: 8px 6px; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  td { padding: 9px 6px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  input.budget-input {
    width: 90px;
    background: var(--card-bg-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 5px 8px;
    font-size: 12px;
  }
  .cpl { color: var(--success); font-weight: 600; }
  .cpl.na { color: var(--text-dim); font-weight: 400; }

  .loading, .error {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .error { color: var(--danger); }

  canvas { max-height: 280px; }
</style>
</head>
<body>

<h1>📊 Дашборд ключевых метрик</h1>
<div class="subtitle" id="subtitle">Загрузка данных...</div>

<div class="toolbar">
  <div>
    <label>С даты</label>
    <input type="date" id="fromDate">
  </div>
  <div>
    <label>По дату</label>
    <input type="date" id="toDate">
  </div>
  <button onclick="loadData()">Применить</button>
  <div class="quick-ranges" id="quickRanges">
    <button data-days="7">7 дней</button>
    <button data-days="30">30 дней</button>
    <button data-days="90">90 дней</button>
    <button data-days="0">Всё время</button>
  </div>
  <button class="secondary" onclick="loadData()" style="margin-left:auto">↻ Обновить</button>
</div>

<div id="content">
  <div class="loading">Загрузка данных из CRM…</div>
</div>

<script>
const API_BASE = window.location.origin;
let currentData = null;
let budgets = JSON.parse(localStorage.getItem('sourceBudgets') || '{}');

// Стадии, которые исключаем из "рабочей" воронки как технический мусор,
// но всё равно показываем отдельно для информации.
const TECH_STAGES = ['UC_H1A47U', 'UC_QQ0YHS']; // Спам, Дубли

function formatDate(d) {
  return d.toISOString().slice(0, 10);
}

function setQuickRange(days) {
  const to = new Date();
  const from = new Date();
  if (days > 0) {
    from.setDate(from.getDate() - days);
    document.getElementById('fromDate').value = formatDate(from);
    document.getElementById('toDate').value = formatDate(to);
  } else {
    document.getElementById('fromDate').value = '';
    document.getElementById('toDate').value = '';
  }
  document.querySelectorAll('#quickRanges button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  loadData();
}

document.querySelectorAll('#quickRanges button').forEach(btn => {
  btn.addEventListener('click', (e) => setQuickRange(Number(btn.dataset.days)));
});

async function loadData() {
  const from = document.getElementById('fromDate').value;
  const to = document.getElementById('toDate').value;

  document.getElementById('content').innerHTML = '<div class="loading">Загрузка данных из CRM…</div>';

  const params = new URLSearchParams();
  if (from) params.set('from', from);
  if (to) params.set('to', to);

  try {
    const res = await fetch(`${API_BASE}/api/dashboard-data?${params.toString()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    currentData = data;
    render(data);
  } catch (err) {
    document.getElementById('content').innerHTML = `<div class="error">Ошибка загрузки: ${err.message}</div>`;
  }
}

function render(data) {
  document.getElementById('subtitle').textContent =
    `Всего сделок в выборке: ${data.totalDeals} · Обновлено: ${new Date(data.generatedAt).toLocaleString('ru-RU')}`;

  const workingStages = data.stages.filter(s => !TECH_STAGES.includes(s.stageId));
  const techStages = data.stages.filter(s => TECH_STAGES.includes(s.stageId));

  const totalLeads = workingStages.reduce((sum, s) => sum + s.count, 0);
  const wonStage = data.stages.find(s => s.semantics === 'S');
  const lostStage = data.stages.find(s => s.semantics === 'F' && !TECH_STAGES.includes(s.stageId));
  const wonCount = wonStage ? wonStage.count : 0;
  const overallConversion = totalLeads > 0 ? ((wonCount / totalLeads) * 100).toFixed(1) : '0.0';
  const spamCount = techStages.find(s => s.stageId === 'UC_H1A47U')?.count || 0;
  const dupCount = techStages.find(s => s.stageId === 'UC_QQ0YHS')?.count || 0;

  let html = '';

  // KPI-карточки
  html += `<div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-value">${data.totalDeals}</div><div class="kpi-label">Всего сделок за период</div></div>
    <div class="kpi-card"><div class="kpi-value">${totalLeads}</div><div class="kpi-label">В рабочей воронке</div></div>
    <div class="kpi-card"><div class="kpi-value">${wonCount}</div><div class="kpi-label">Успешных сделок</div></div>
    <div class="kpi-card"><div class="kpi-value">${overallConversion}%</div><div class="kpi-label">Общая конверсия в успех</div></div>
    <div class="kpi-card"><div class="kpi-value">${spamCount}</div><div class="kpi-label">🚫 Спам</div></div>
    <div class="kpi-card"><div class="kpi-value">${dupCount}</div><div class="kpi-label">📋 Дубли</div></div>
  </div>`;

  html += `<div class="grid-2">`;

  // Воронка по стадиям
  html += `<div class="card"><h2>Воронка по стадиям</h2><div id="funnel"></div></div>`;

  // График по источникам
  html += `<div class="card"><h2>Лиды по источникам</h2><canvas id="sourceChart"></canvas></div>`;

  html += `</div>`;

  // Таблица источников со стоимостью лида
  html += `<div class="card">
    <h2>Источники и стоимость лида (расход указывается вручную)</h2>
    <table>
      <thead><tr><th>Источник</th><th>Кол-во лидов</th><th>Расход, ₽</th><th>Цена лида, ₽</th></tr></thead>
      <tbody id="sourceTable"></tbody>
    </table>
  </div>`;

  document.getElementById('content').innerHTML = html;

  renderFunnel(workingStages, techStages);
  renderSourceChart(data.sources);
  renderSourceTable(data.sources);
}

function renderFunnel(workingStages, techStages) {
  const container = document.getElementById('funnel');
  const maxCount = Math.max(...workingStages.map(s => s.count), 1);
  let prevCount = null;
  let html = '';

  workingStages.forEach((s) => {
    const width = (s.count / maxCount) * 100;
    let convHtml = '';
    if (prevCount !== null && prevCount > 0) {
      const conv = ((s.count / prevCount) * 100).toFixed(0);
      convHtml = `${conv}%`;
    }
    html += `<div class="funnel-row">
      <div class="funnel-name">${s.name}</div>
      <div class="funnel-bar-wrap"><div class="funnel-bar" style="width:${width}%"></div></div>
      <div class="funnel-count">${s.count}</div>
      <div class="funnel-conv">${convHtml}</div>
    </div>`;
    prevCount = s.count;
  });

  if (techStages.length > 0) {
    html += `<div style="margin-top:14px;padding-top:10px;border-top:1px dashed var(--border);font-size:11px;color:var(--text-dim)">Технические стадии (не входят в воронку):</div>`;
    techStages.forEach((s) => {
      html += `<div class="funnel-row" style="opacity:0.6">
        <div class="funnel-name">${s.name}</div>
        <div class="funnel-bar-wrap"><div class="funnel-bar" style="width:${Math.min(100, (s.count / maxCount) * 100)}%;background:var(--danger)"></div></div>
        <div class="funnel-count">${s.count}</div>
        <div class="funnel-conv"></div>
      </div>`;
    });
  }

  container.innerHTML = html;
}

let sourceChartInstance = null;
function renderSourceChart(sources) {
  const ctx = document.getElementById('sourceChart');
  const top = sources.slice(0, 8);
  if (sourceChartInstance) sourceChartInstance.destroy();
  sourceChartInstance = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: top.map(s => s.name),
      datasets: [{
        data: top.map(s => s.count),
        backgroundColor: ['#6c8cff','#8fa3ff','#4ade80','#fbbf24','#f87171','#a78bfa','#38bdf8','#fb923c'],
        borderColor: '#171b2e',
        borderWidth: 2,
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom', labels: { color: '#e8eaf6', font: { size: 11 }, padding: 12 } }
      }
    }
  });
}

function renderSourceTable(sources) {
  const tbody = document.getElementById('sourceTable');
  let html = '';
  sources.forEach((s) => {
    const budget = budgets[s.sourceId] ?? '';
    const budgetNum = parseFloat(budget);
    const cpl = budgetNum > 0 && s.count > 0 ? (budgetNum / s.count).toFixed(0) : null;
    html += `<tr>
      <td>${s.name}</td>
      <td>${s.count}</td>
      <td><input type="number" class="budget-input" data-source="${s.sourceId}" value="${budget}" placeholder="0" min="0"></td>
      <td class="${cpl ? 'cpl' : 'cpl na'}">${cpl ? cpl + ' ₽' : '—'}</td>
    </tr>`;
  });
  tbody.innerHTML = html;

  tbody.querySelectorAll('.budget-input').forEach((input) => {
    input.addEventListener('input', (e) => {
      const sourceId = e.target.dataset.source;
      budgets[sourceId] = e.target.value;
      localStorage.setItem('sourceBudgets', JSON.stringify(budgets));
      renderSourceTable(currentData.sources); // пересчитать CPL сразу
    });
  });
}

// При загрузке страницы — сразу тянем все данные без ограничения по дате
loadData();
</script>

</body>
</html>
