<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конверсия по доменам — обзор для руководителя</title>
<style>
  :root {
    --bg: #0b0e1a;
    --card-bg: #151a2c;
    --card-bg-2: #1c2238;
    --border: #2a3050;
    --text: #eef0fa;
    --text-dim: #9aa1c4;
    --accent: #6c8cff;
    --success: #4ade80;
    --warning: #fbbf24;
    --danger: #f87171;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 24px;
  }
  .header { max-width: 1100px; margin: 0 auto 20px; }
  h1 { font-size: 26px; font-weight: 700; margin: 0 0 6px; }
  .subtitle { color: var(--text-dim); font-size: 14px; }

  .back-link { max-width: 1100px; margin: 0 auto 20px; }
  .back-link a {
    display: inline-block; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 16px; color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 600;
  }

  .toolbar {
    max-width: 1100px;
    margin: 0 auto 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
  }
  .toolbar label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; }
  .toolbar input[type="date"] {
    background: var(--card-bg-2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 8px 10px; font-size: 13px;
  }
  .toolbar button {
    background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .toolbar button:hover { filter: brightness(1.1); }
  .quick-ranges { display: flex; gap: 6px; }
  .quick-ranges button {
    background: var(--card-bg-2); border: 1px solid var(--border); color: var(--text-dim);
    padding: 7px 12px; font-size: 12px; font-weight: 500;
  }
  .quick-ranges button.active { background: var(--accent); color: white; border-color: var(--accent); }

  .container { max-width: 1100px; margin: 0 auto; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; color: var(--text-dim); font-weight: 500; padding: 10px 8px;
    border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em;
  }
  th.num, td.num { text-align: right; }
  td { padding: 12px 8px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(108,140,255,0.05); }
  .domain-name { font-weight: 600; }
  .pct { font-weight: 700; }
  .pct.qual { color: var(--warning); }
  .pct.meeting { color: var(--success); }

  .loading, .error { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .error { color: var(--danger); }

  .auth-screen {
    max-width: 360px;
    margin: 120px auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px;
    text-align: center;
  }
  .auth-screen h2 { font-size: 18px; margin: 0 0 6px; }
  .auth-screen p { color: var(--text-dim); font-size: 13px; margin: 0 0 20px; }
  .auth-screen input {
    width: 100%; background: var(--card-bg-2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 12px 14px; font-size: 16px; text-align: center; margin-bottom: 14px;
    letter-spacing: 4px;
  }
  .auth-screen button {
    width: 100%; background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .auth-screen .auth-error { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>

<div id="authScreen" class="auth-screen">
  <h2>🔒 Доступ ограничен</h2>
  <p>Введите пароль для просмотра отчёта</p>
  <input type="password" id="passwordInput" placeholder="Пароль" maxlength="20" autofocus>
  <button onclick="tryLogin()">Войти</button>
  <div class="auth-error" id="authError"></div>
</div>

<div id="mainApp" style="display:none">

<div class="header">
  <h1>🌐 Конверсия по доменам</h1>
  <div class="subtitle" id="subtitle">Загрузка данных...</div>
</div>

<div class="back-link">
  <a href="/ceo-dashboard.html">← К стоимости лида</a>
</div>

<div class="toolbar">
  <div>
    <label>С даты</label>
    <input type="date" id="fromDate">
  </div>
  <div>
    <label>По дату</label>
    <input type="date" id="toDate">
  </div>
  <button onclick="loadData()">Применить</button>
  <div class="quick-ranges" id="quickRanges">
    <button data-days="7">7 дней</button>
    <button data-days="30">30 дней</button>
    <button data-days="90">90 дней</button>
    <button data-days="0">Всё время</button>
  </div>
</div>

<div class="container" id="content">
  <div class="loading">Загрузка данных из CRM…</div>
</div>

</div>

<script>
const API_BASE = window.location.origin;
let currentData = null;
// Переиспользуем тот же пароль, что и на основной CEO-странице — один
// вход открывает доступ ко всем страницам CEO-раздела в этой вкладке.
let ceoPassword = sessionStorage.getItem('ceoPassword') || '';

function formatDate(d) { return d.toISOString().slice(0, 10); }

function setQuickRange(days) {
  const to = new Date();
  const from = new Date();
  if (days > 0) {
    from.setDate(from.getDate() - days);
    document.getElementById('fromDate').value = formatDate(from);
    document.getElementById('toDate').value = formatDate(to);
  } else {
    document.getElementById('fromDate').value = '';
    document.getElementById('toDate').value = '';
  }
  document.querySelectorAll('#quickRanges button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  loadData();
}

document.querySelectorAll('#quickRanges button').forEach(btn => {
  btn.addEventListener('click', () => setQuickRange(Number(btn.dataset.days)));
});

async function loadData() {
  const from = document.getElementById('fromDate').value;
  const to = document.getElementById('toDate').value;

  document.getElementById('content').innerHTML = '<div class="loading">Загрузка данных из CRM…</div>';

  const params = new URLSearchParams();
  if (from) params.set('from', from);
  if (to) params.set('to', to);

  try {
    const res = await fetch(`${API_BASE}/api/ceo-domains-data?${params.toString()}`, {
      headers: { 'X-Ceo-Password': ceoPassword },
    });
    if (res.status === 401) {
      sessionStorage.removeItem('ceoPassword');
      showAuthScreen('Неверный пароль. Попробуйте снова.');
      return;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    currentData = data;
    render(data);
  } catch (err) {
    document.getElementById('content').innerHTML = `<div class="error">Ошибка загрузки: ${err.message}</div>`;
  }
}

function showAuthScreen(errorMsg) {
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('authScreen').style.display = 'block';
  document.getElementById('authError').textContent = errorMsg || '';
  document.getElementById('passwordInput').value = '';
  document.getElementById('passwordInput').focus();
}

async function tryLogin() {
  const input = document.getElementById('passwordInput').value.trim();
  if (!input) return;

  ceoPassword = input;

  const res = await fetch(`${API_BASE}/api/ceo-domains-data`, {
    headers: { 'X-Ceo-Password': ceoPassword },
  });

  if (res.status === 401) {
    document.getElementById('authError').textContent = 'Неверный пароль';
    document.getElementById('passwordInput').value = '';
    document.getElementById('passwordInput').focus();
    return;
  }

  sessionStorage.setItem('ceoPassword', ceoPassword);
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  loadData();
}

document.getElementById('passwordInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') tryLogin();
});

function render(data) {
  document.getElementById('subtitle').textContent =
    `Доменов: ${data.domains.length} · Всего сделок: ${data.totalDeals} · Обновлено: ${new Date(data.generatedAt).toLocaleString('ru-RU')}`;

  let rows = data.domains.map((d) => `
    <tr>
      <td class="domain-name">${d.domain}</td>
      <td class="num">${d.leads}</td>
      <td class="num">${d.qual}</td>
      <td class="num pct qual">${d.qualConversion.toFixed(1)}%</td>
      <td class="num">${d.meetings}</td>
      <td class="num pct meeting">${d.meetingConversion.toFixed(1)}%</td>
    </tr>
  `).join('');

  document.getElementById('content').innerHTML = `
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Домен</th>
            <th class="num">Лидов</th>
            <th class="num">Квал</th>
            <th class="num">Конв. в квал</th>
            <th class="num">Встреч</th>
            <th class="num">Конв. во встречу</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

if (ceoPassword) {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  loadData();
} else {
  showAuthScreen();
}
</script>

</body>
</html>
