<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Стоимость лида — обзор для руководителя</title>
<style>
  :root {
    --bg: #0b0e1a;
    --card-bg: #151a2c;
    --card-bg-2: #1c2238;
    --border: #2a3050;
    --text: #eef0fa;
    --text-dim: #9aa1c4;
    --accent: #6c8cff;
    --success: #4ade80;
    --warning: #fbbf24;
    --danger: #f87171;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 24px;
  }
  .header { max-width: 1100px; margin: 0 auto 28px; }
  h1 { font-size: 26px; font-weight: 700; margin: 0 0 6px; }
  .subtitle { color: var(--text-dim); font-size: 14px; }

  .toolbar {
    max-width: 1100px;
    margin: 0 auto 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
  }
  .toolbar label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; }
  .toolbar input[type="date"] {
    background: var(--card-bg-2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 8px 10px; font-size: 13px;
  }
  .toolbar button {
    background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .toolbar button:hover { filter: brightness(1.1); }
  .quick-ranges { display: flex; gap: 6px; }
  .quick-ranges button {
    background: var(--card-bg-2); border: 1px solid var(--border); color: var(--text-dim);
    padding: 7px 12px; font-size: 12px; font-weight: 500;
  }
  .quick-ranges button.active { background: var(--accent); color: white; border-color: var(--accent); }

  .container { max-width: 1100px; margin: 0 auto; }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
    margin-bottom: 20px;
  }

  .source-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
  }
  .source-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .source-leads { color: var(--text-dim); font-size: 12px; margin-bottom: 18px; }

  .price-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }
  .price-row:first-of-type { border-top: none; }
  .price-label { font-size: 13px; color: var(--text-dim); }
  .price-value { font-size: 20px; font-weight: 700; }
  .price-value.qual { color: var(--warning); }
  .price-value.meeting { color: var(--success); }
  .price-value.na { color: var(--text-dim); font-size: 14px; font-weight: 400; }

  .budget-input-wrap { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
  .budget-input-wrap label { font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 6px; }
  .budget-input-wrap input {
    width: 100%; background: var(--card-bg-2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 8px 10px; font-size: 13px;
  }
  .fixed-price-badge {
    display: inline-block; background: rgba(108,140,255,0.15); color: var(--accent);
    font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 6px; margin-top: 14px;
  }

  .summary-card {
    background: linear-gradient(135deg, var(--card-bg), var(--card-bg-2));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 24px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
  }
  .summary-item .value { font-size: 26px; font-weight: 700; }
  .summary-item .label { color: var(--text-dim); font-size: 12px; margin-top: 4px; }

  .loading, .error { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .error { color: var(--danger); }

  .auth-screen {
    max-width: 360px;
    margin: 120px auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px;
    text-align: center;
  }
  .auth-screen h2 { font-size: 18px; margin: 0 0 6px; }
  .auth-screen p { color: var(--text-dim); font-size: 13px; margin: 0 0 20px; }
  .auth-screen input {
    width: 100%; background: var(--card-bg-2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 12px 14px; font-size: 16px; text-align: center; margin-bottom: 14px;
    letter-spacing: 4px;
  }
  .auth-screen button {
    width: 100%; background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .auth-screen .auth-error { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>

<div id="authScreen" class="auth-screen">
  <h2>🔒 Доступ ограничен</h2>
  <p>Введите пароль для просмотра отчёта</p>
  <input type="password" id="passwordInput" placeholder="Пароль" maxlength="20" autofocus>
  <button onclick="tryLogin()">Войти</button>
  <div class="auth-error" id="authError"></div>
</div>

<div id="mainApp" style="display:none">

<div class="header">
  <h1>💰 Стоимость лида</h1>
  <div class="subtitle" id="subtitle">Загрузка данных...</div>
</div>

<div class="toolbar">
  <div>
    <label>С даты</label>
    <input type="date" id="fromDate">
  </div>
  <div>
    <label>По дату</label>
    <input type="date" id="toDate">
  </div>
  <button onclick="loadData()">Применить</button>
  <div class="quick-ranges" id="quickRanges">
    <button data-days="7">7 дней</button>
    <button data-days="30">30 дней</button>
    <button data-days="90">90 дней</button>
    <button data-days="0">Всё время</button>
  </div>
</div>

<div class="container" id="content">
  <div class="loading">Загрузка данных из CRM…</div>
</div>

</div>

<script>
const API_BASE = window.location.origin;
let currentData = null;
let budgets = JSON.parse(localStorage.getItem('ceoSourceBudgets') || '{}');
let ceoPassword = sessionStorage.getItem('ceoPassword') || '';

function formatDate(d) { return d.toISOString().slice(0, 10); }

function setQuickRange(days) {
  const to = new Date();
  const from = new Date();
  if (days > 0) {
    from.setDate(from.getDate() - days);
    document.getElementById('fromDate').value = formatDate(from);
    document.getElementById('toDate').value = formatDate(to);
  } else {
    document.getElementById('fromDate').value = '';
    document.getElementById('toDate').value = '';
  }
  document.querySelectorAll('#quickRanges button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  loadData();
}

document.querySelectorAll('#quickRanges button').forEach(btn => {
  btn.addEventListener('click', () => setQuickRange(Number(btn.dataset.days)));
});

async function loadData() {
  const from = document.getElementById('fromDate').value;
  const to = document.getElementById('toDate').value;

  document.getElementById('content').innerHTML = '<div class="loading">Загрузка данных из CRM…</div>';

  const params = new URLSearchParams();
  if (from) params.set('from', from);
  if (to) params.set('to', to);

  try {
    const res = await fetch(`${API_BASE}/api/ceo-dashboard-data?${params.toString()}`, {
      headers: { 'X-Ceo-Password': ceoPassword },
    });
    if (res.status === 401) {
      // Пароль оказался неверным (или устарел) — сбрасываем и просим ввести заново.
      sessionStorage.removeItem('ceoPassword');
      showAuthScreen('Неверный пароль. Попробуйте снова.');
      return;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    currentData = data;
    render(data);
  } catch (err) {
    document.getElementById('content').innerHTML = `<div class="error">Ошибка загрузки: ${err.message}</div>`;
  }
}

function showAuthScreen(errorMsg) {
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('authScreen').style.display = 'block';
  document.getElementById('authError').textContent = errorMsg || '';
  document.getElementById('passwordInput').value = '';
  document.getElementById('passwordInput').focus();
}

async function tryLogin() {
  const input = document.getElementById('passwordInput').value.trim();
  if (!input) return;

  ceoPassword = input;

  // Проверяем пароль реальным запросом к API — сервер сам решает, верный он или нет.
  const res = await fetch(`${API_BASE}/api/ceo-dashboard-data`, {
    headers: { 'X-Ceo-Password': ceoPassword },
  });

  if (res.status === 401) {
    document.getElementById('authError').textContent = 'Неверный пароль';
    document.getElementById('passwordInput').value = '';
    document.getElementById('passwordInput').focus();
    return;
  }

  // Пароль верный — сохраняем на время сессии вкладки и показываем дашборд.
  sessionStorage.setItem('ceoPassword', ceoPassword);
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  loadData();
}

document.getElementById('passwordInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') tryLogin();
});

function getLeadPrice(source) {
  if (source.fixedLeadPrice != null) return source.fixedLeadPrice;
  const budget = parseFloat(budgets[source.sourceId]);
  if (!budget || source.leads === 0) return null;
  return budget / source.leads;
}

function render(data) {
  document.getElementById('subtitle').textContent =
    `Данные за период · Обновлено: ${new Date(data.generatedAt).toLocaleString('ru-RU')}`;

  // Общая сводка
  const totalLeads = data.sources.reduce((sum, s) => sum + s.leads, 0);
  const totalQual = data.sources.reduce((sum, s) => sum + s.qual, 0);
  const totalMeetings = data.sources.reduce((sum, s) => sum + s.meetings, 0);

  let html = `<div class="summary-card">
    <div class="summary-item"><div class="value">${totalLeads}</div><div class="label">Всего лидов</div></div>
    <div class="summary-item"><div class="value">${totalQual}</div><div class="label">Квалифицировано</div></div>
    <div class="summary-item"><div class="value">${totalMeetings}</div><div class="label">Встреч назначено</div></div>
  </div>`;

  html += `<div class="cards-grid">`;

  data.sources.forEach((s) => {
    const leadPrice = getLeadPrice(s);

    let qualPriceHtml, meetingPriceHtml;

    if (leadPrice == null) {
      qualPriceHtml = `<span class="price-value na">укажите расход</span>`;
      meetingPriceHtml = `<span class="price-value na">укажите расход</span>`;
    } else {
      const qualPrice = s.qual > 0 ? (leadPrice * s.leads / s.qual) : null;
      const meetingPrice = s.meetings > 0 ? (leadPrice * s.leads / s.meetings) : null;
      qualPriceHtml = qualPrice != null
        ? `<span class="price-value qual">${qualPrice.toFixed(0)} ₽</span>`
        : `<span class="price-value na">нет квал</span>`;
      meetingPriceHtml = meetingPrice != null
        ? `<span class="price-value meeting">${meetingPrice.toFixed(0)} ₽</span>`
        : `<span class="price-value na">нет встреч</span>`;
    }

    const fixedBadge = s.fixedLeadPrice != null
      ? `<div class="fixed-price-badge">Фикс. цена лида: ${s.fixedLeadPrice} ₽</div>`
      : '';

    const budgetInput = s.fixedLeadPrice == null
      ? `<div class="budget-input-wrap">
          <label>Расход на источник, ₽</label>
          <input type="number" min="0" placeholder="0" data-source="${s.sourceId}"
                 value="${budgets[s.sourceId] ?? ''}" class="budget-field">
        </div>`
      : '';

    html += `<div class="source-card">
      <div class="source-name">${s.name}</div>
      <div class="source-leads">${s.leads} лидов · ${s.qual} квал · ${s.meetings} встреч</div>
      <div class="price-row">
        <div class="price-label">Цена квал-лида</div>
        ${qualPriceHtml}
      </div>
      <div class="price-row">
        <div class="price-label">Цена встречи</div>
        ${meetingPriceHtml}
      </div>
      ${fixedBadge}
      ${budgetInput}
    </div>`;
  });

  html += `</div>`;

  document.getElementById('content').innerHTML = html;

  document.querySelectorAll('.budget-field').forEach((input) => {
    input.addEventListener('input', (e) => {
      const sourceId = e.target.dataset.source;
      budgets[sourceId] = e.target.value;
      localStorage.setItem('ceoSourceBudgets', JSON.stringify(budgets));
      render(currentData); // пересчитать цены сразу
    });
  });
}

// При открытии страницы: если пароль уже был введён в этой вкладке (сохранён
// в sessionStorage), показываем дашборд сразу; иначе — экран ввода пароля.
if (ceoPassword) {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  loadData();
} else {
  showAuthScreen();
}
</script>

</body>
</html>
